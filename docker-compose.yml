version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civpulse_cms
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: localdev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d civpulse_cms']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
